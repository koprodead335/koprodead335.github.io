<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css?v=1"> <!-- Сброс кэша: ?v=1 заставляет браузеры (особенно мобильные) загружать актуальную версию CSS вместо использования кэшированных копий -->
    <title>Связаться с нами</title>
    <link rel="shortcut icon" href="images/287-2873041_adobe-software-keyboard-shortcuts-hands-on-keyboard-icon.png" type="images/x-icon">
</head>
<body>
    <!-- Декоративные элементы -->
    <div class="circle circle1"></div>
    <div class="circle circle2"></div>
    <!-- Форма -->
    <div class="form-box">
        <h1>Свяжитесь с нами</h1>
        <p class="subtitle">
            Оставьте сообщение, и мы ответим вам
        </p>
        <form>
            <label for="name">Ваше имя</label>
            <input
                type="text"
                id="name" autocomplete="cc-given-name"
                placeholder="Введите имя"
                required
            >
            <label for="email">Email</label>
            <input
                type="email"
                id="email" autocomplete="off"
                placeholder="example@mail.com"
                required
            >
            <label for="message">Сообщение</label>
            <textarea
                id="message" type="text"
                placeholder="Напишите сообщение..."
                required
            ></textarea>
            <button type="submit">
                Отправить сообщение
            </button>
        </form>
    </div>
</body>
</html>
